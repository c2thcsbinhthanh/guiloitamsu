<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Trang Web Tùy Chỉnh Tiêu Đề</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fce4ec;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.2);
            max-width: 480px;
            width: 90%;
            transition: all 0.3s ease;
        }
        .cat-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
        }
        input[type="text"] {
            width: 85%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #e91e63;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background-color: #e91e63;
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #d81b60;
        }
        .btn-yes {
            background-color: #4caf50;
            color: white;
            z-index: 10;
            position: relative;
        }
        .btn-yes:hover {
            background-color: #43a047;
        }
        .btn-no {
            background-color: #f44336;
            color: white;
            position: relative;
        }
        .link-box {
            margin-top: 25px;
            word-break: break-all;
            background: #f8bbd0;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            text-align: left;
            color: #880e4f;
            border: 1px dashed #e91e63;
        }
        .button-group {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            gap: 15px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .desc-text {
            color: #c2185b;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="app"></div>

    <script>
        // Sử dụng link ảnh tĩnh an toàn 100% không bị lỗi chặn hotlink
        const catImages = {
            0: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&auto=format&fit=crop",       
            1: "https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=400&auto=format&fit=crop",        
            2: "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=400&auto=format&fit=crop", 
            3: "https://images.unsplash.com/photo-1561948955-570b270e7c36?w=400&auto=format&fit=crop",     
            4: "https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=400&auto=format&fit=crop",     
            5: "https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=400&auto=format&fit=crop",
            6: "https://images.unsplash.com/photo-1519052537078-e6302a4968d4?w=400&auto=format&fit=crop",
            7: "https://images.unsplash.com/photo-1533743983669-94fa5c4338ec?w=400&auto=format&fit=crop",     
            happy: "https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?w=400&auto=format&fit=crop"   
        };

        const urlParams = new URLSearchParams(window.location.search);
        const titleParam = urlParams.get('title');
        const app = document.getElementById('app');

        let noClicks = 0;

        if (!titleParam) {
            app.innerHTML = `
                <h2>Tạo Lời Gửi Chân Thành ❤️</h2>
                <input type="text" id="titleInput" placeholder="Nhập câu hỏi (VD: Đi chơi với tớ nhé?)">
                <br>
                <button class="btn-primary" onclick="generateLink()">Tạo Đường Link Mới</button>
                <div id="result" class="link-box" style="display:none;"></div>
            `;
        } else {
            let decodedTitle = decodeURIComponent(titleParam);
            app.innerHTML = `
                <img id="catImg" class="cat-img" src="${catImages[0]}" alt="Mèo meme đáng yêu">
                <h2 id="questionTitle">${decodedTitle}</h2>
                <div class="button-group">
                    <button id="yesBtn" class="btn-yes" onclick="handleYes()">Có</button>
                    <button id="noBtn" class="btn-no" onclick="handleNo()">Kó</button>
                </div>
            `;
        }

        function generateLink() {
            const val = document.getElementById('titleInput').value.trim();
            if (!val) {
                alert('Bạn quên nhập tiêu đề kìa!');
                return;
            }
            const currentUrl = window.location.href.split('?')[0];
            const newLink = `${currentUrl}?title=${encodeURIComponent(val)}`;
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<strong>Link của bạn đã sẵn sàng:</strong><br><br><a href="${newLink}" target="_blank" style="color: #e91e63; font-weight: bold; text-decoration: none;">${newLink}</a>`;
        }

        function handleNo() {
            noClicks++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const catImg = document.getElementById('catImg');

            if (catImages[noClicks]) {
                catImg.src = catImages[noClicks];
            }

            if (noClicks < 7) {
                // Phóng to nút Có đồng thời dịch chuyển cả 2 nút sang phải một chút
                let yesScale = 1 + (noClicks * 0.35);
                let shiftOffset = noClicks * 12;
                
                yesBtn.style.transform = `translateX(${shiftOffset}px) scale(${yesScale})`;
                
                let noRightOffset = noClicks * 18;
                let noScale = 1 - (noClicks * 0.08);
                noBtn.style.transform = `translateX(${noRightOffset}px) scale(${noScale})`;
            } else {
                // Đến lần bấm thứ 7: Nút Có phóng to full màn hình
                const appContainer = document.getElementById('app');
                appContainer.style.position = 'fixed';
                appContainer.style.top = '0';
                appContainer.style.left = '0';
                appContainer.style.width = '100vw';
                appContainer.style.height = '100vh';
                appContainer.style.maxWidth = 'none';
                appContainer.style.borderRadius = '0';
                appContainer.style.display = 'flex';
                appContainer.style.flexDirection = 'column';
                appContainer.style.justifyContent = 'center';
                appContainer.style.alignItems = 'center';
                appContainer.style.backgroundColor = '#fce4ec';

                yesBtn.style.transform = 'scale(4.5)';
                yesBtn.style.margin = '40px 0';
                yesBtn.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
                noBtn.style.display = 'none'; 
            }
        }

        function handleYes() {
            const app = document.getElementById('app');
            // Kiểm tra số lần bấm "Kó" để đổi chữ mô tả phù hợp
            let timeText = (noClicks < 4) ? "nhanh nha" : "lâu vậy";
            
            app.innerHTML = `
                <img class="cat-img" src="${catImages.happy}" alt="Mèo vui vẻ" style="width: 220px; height: 220px;">
                <div class="desc-text">Sao chưa đồng ý nữa <br> đồng ý đi mà (${timeText})</div>
                <h2 style="font-size: 28px; color: #e91e63;">Yayyy! 🎉 Cảm ơn bạn nhé! ❤️</h2>
            `;
        }
    </script>
</body>
</html>
