<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Lời Yêu Thương</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fce4ec;
            overflow: hidden;
            position: relative;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            transition: all 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .cat-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        input[type="text"] {
            width: 85%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #e91e63;
            color: white;
        }
        .btn-primary.copied {
            background-color: #4caf50;
        }
        .btn-yes {
            background-color: #4caf50;
            color: white;
            font-size: 18px;
            padding: 12px 28px;
            z-index: 10;
            transition: font-size 0.3s ease, padding 0.3s ease; 
        }
        .btn-no {
            background-color: #f44336;
            color: white;
            font-size: 18px;
            padding: 12px 28px;
            margin-left: 15px;
            position: relative;
            transition: all 0.3s ease;
        }
        .link-box {
            margin-top: 20px;
            word-break: break-all;
            background: #f1f1f1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: left;
        }
        .button-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
        }
        .error-text {
            color: red;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
        #noText {
            font-size: 15px;
            color: #d84315;
            font-style: italic;
            font-weight: bold;
            min-height: 20px;
            margin-bottom: 10px;
            display: block;
        }
        .author-text {
            font-size: 14px;
            color: #777;
            margin-top: -15px;
            margin-bottom: 20px;
            font-style: italic;
        }
        .custom-desc {
            font-size: 16px;
            color: #e91e63;
            margin-top: 15px;
            font-weight: bold;
        }
        .advanced-toggle {
            background: none;
            color: #e91e63;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            margin-bottom: 15px;
            padding: 0;
        }
        .advanced-section {
            display: none;
            text-align: left;
            background: #fafafa;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #ddd;
            margin-bottom: 15px;
        }
        .advanced-section label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }
        .footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #888;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container" id="app"></div>
    <div class="footer">© 2026 | © Copyright ATCX. All rights reserved.</div>

    <script>
        const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' fill='%23ffb6c1'/><text x='50%' y='50%' font-family='Arial' font-size='16' fill='white' text-anchor='middle' dy='.3em'>(^•ᴥ•^) Meow</text></svg>";

        const catImages = {
            0: "https://media.giphy.com/media/vFKqnCdLPNOKc/giphy.gif",       
            1: "https://media.giphy.com/media/SqmkZ5IdwzTP2/giphy.gif",       
            2: "https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif",       
            3: "https://media.giphy.com/media/xdH0MjQ83lGFVv7gjR/giphy.gif",  
            4: "https://media.giphy.com/media/QtdE1JSEHHEOVqVcht/giphy.gif",  
            5: "https://media.giphy.com/media/WTjnWYENpLxS8JQ5rz/giphy.gif",  
            6: "https://media.giphy.com/media/2uwZ4xi75JhxZYeyQB/giphy.gif",  
            7: "https://media.giphy.com/media/fLJ7SLBhTqatGF9hwI/giphy.gif",  
            happy: "https://media.giphy.com/media/qFmdpUKAFZ6rMobzzu/giphy.gif" 
        };

        const noTexts = [
            "Sao chưa đồng ý nữa?", 
            "Đồng ý đi mà! 🥺", 
            "Năn nỉ luôn á, nhấn Có đi! 😭", 
            "Kó cái gì mà Kó! Nhấn Có kìa!", 
            "Cho cơ hội nữa đó, nhấn Có đi!", 
            "Không thoát được đâu! 😈", 
            "Hết cách rồi, chỉ có 1 nút thôi! 😂" 
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const titleParam = urlParams.get('title');
        const authorParam = urlParams.get('author');
        const descParam = urlParams.get('desc');
        const app = document.getElementById('app');

        if (!titleParam) {
            app.innerHTML = `
                <h2>Tạo Lời Mời Của Bạn</h2>
                <input type="text" id="titleInput" placeholder="Nhập câu hỏi (VD: Đi chơi với tớ nhé?)">
                <div id="errorText" class="error-text">Vui lòng nhập nội dung!</div>
                
                <button type="button" class="advanced-toggle" onclick="toggleAdvanced()">⚙️ Tùy chọn nâng cao</button>
                <div id="advancedSection" class="advanced-section">
                    <label>Tên người tạo (@thông tin):</label>
                    <input type="text" id="authorInput" placeholder="VD: Của Crush tặng bạn" style="width: 93%; margin-bottom: 10px;">
                    <label>Lời nhắn riêng khi nhấn Có:</label>
                    <input type="text" id="descInput" placeholder="VD: Chuẩn bị 8h tối anh qua đón nhé!" style="width: 93%; margin-bottom: 0;">
                </div>
                <br>
                <button id="genBtn" class="btn-primary" onclick="generateLink()">Tạo Đường Link</button>
                <div id="result" class="link-box" style="display:none;"></div>
            `;
        } 
        else {
            let decodedTitle = decodeURIComponent(titleParam);
            let decodedAuthor = authorParam ? decodeURIComponent(authorParam) : '';
            
            app.innerHTML = `
                <img id="catImg" class="cat-img" src="${catImages[0]}" onerror="this.src='${fallbackImg}'" referrerpolicy="no-referrer" alt="Mèo meme">
                <h2 id="questionTitle">${decodedTitle}</h2>
                ${decodedAuthor ? `<div class="author-text">@${decodedAuthor}</div>` : ''}
                <div id="noText"></div>
                <div class="button-group">
                    <button id="yesBtn" class="btn-yes" onclick="handleYes()">Có</button>
                    <button id="noBtn" class="btn-no" onclick="handleNo()">Kó</button>
                </div>
            `;
        }

        function toggleAdvanced() {
            const section = document.getElementById('advancedSection');
            section.style.display = section.style.display === 'block' ? 'none' : 'block';
        }

        function generateLink() {
            const val = document.getElementById('titleInput').value.trim();
            const authorVal = document.getElementById('authorInput').value.trim();
            const descVal = document.getElementById('descInput').value.trim();
            const errorText = document.getElementById('errorText');
            
            if (!val) {
                errorText.style.display = 'block';
                return;
            }
            errorText.style.display = 'none';
            
            const currentUrl = window.location.href.split('?')[0];
            let newLink = `${currentUrl}?title=${encodeURIComponent(val)}`;
            if (authorVal) newLink += `&author=${encodeURIComponent(authorVal)}`;
            if (descVal) newLink += `&desc=${encodeURIComponent(descVal)}`;

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <strong>Link gốc của bạn:</strong><br>
                <a id="rawLink" href="${newLink}" target="_blank">${newLink}</a><br><br>
                <button onclick="copyLink('${newLink}', this)" class="btn-primary" style="font-size: 13px; padding: 6px 12px;">Sao chép link gốc</button>
                <button id="shortBtn" onclick="shortenLink('${newLink}')" class="btn-primary" style="font-size: 13px; padding: 6px 12px; background-color: #ff9800; margin-left: 5px;">🔗 Rút gọn link</button>
                
                <div id="shortResult" style="margin-top: 10px; display: none; border-top: 1px solid #ddd; padding-top: 8px;">
                    <strong>Link rút gọn:</strong><br>
                    <a id="shortLinkText" href="" target="_blank" style="color: #e91e63; font-weight: bold;"></a><br><br>
                    <button onclick="copyShortLink(this)" class="btn-primary" style="font-size: 13px; padding: 6px 12px; background-color: #4caf50;">Sao chép link rút gọn</button>
                </div>
            `;
        }

        // HÀM RÚT GỌN LINK ĐÃ ĐƯỢC FIX LỖI BẢO MẬT CORS
        function shortenLink(longLink) {
            const shortBtn = document.getElementById('shortBtn');
            shortBtn.innerText = 'Đang rút gọn...';
            shortBtn.disabled = true;

            // Sử dụng is.gd API vì hỗ trợ CORS tốt cho GitHub Pages
            fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longLink)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.shorturl) {
                        showShortLink(data.shorturl);
                        shortBtn.innerText = 'Đã rút gọn ✔️';
                    } else {
                        throw new Error('Lỗi từ is.gd');
                    }
                })
                .catch(err => {
                    console.warn("is.gd bị lỗi, thử dùng phương án dự phòng AllOrigins + TinyURL...", err);
                    
                    // Phương án dự phòng: Dùng proxy để vượt rào CORS cho TinyURL
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(longLink))}`;
                    
                    fetch(proxyUrl)
                        .then(res => res.text())
                        .then(shortUrl => {
                            if (shortUrl && shortUrl.startsWith('http')) {
                                showShortLink(shortUrl);
                                shortBtn.innerText = 'Đã rút gọn ✔️';
                            } else {
                                throw new Error('Proxy cũng lỗi');
                            }
                        })
                        .catch(err2 => {
                            console.error(err2);
                            alert('Hệ thống mạng đang chặn tạo link rút gọn! Vui lòng dùng nút "Sao chép link gốc" nhé.');
                            shortBtn.innerText = '🔗 Rút gọn link';
                            shortBtn.disabled = false;
                        });
                });
        }

        function showShortLink(shortUrl) {
            document.getElementById('shortResult').style.display = 'block';
            const linkEl = document.getElementById('shortLinkText');
            linkEl.href = shortUrl;
            linkEl.innerText = shortUrl;
        }

        function copyLink(link, btn) {
            navigator.clipboard.writeText(link).then(() => {
                let oldText = btn.innerText;
                btn.innerText = 'Đã sao chép! ✔️';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerText = oldText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function copyShortLink(btn) {
            const shortUrl = document.getElementById('shortLinkText').innerText;
            navigator.clipboard.writeText(shortUrl).then(() => {
                let oldText = btn.innerText;
                btn.innerText = 'Đã sao chép! ✔️';
                setTimeout(() => {
                    btn.innerText = oldText;
                }, 2000);
            });
        }

        let noClicks = 0;
        function handleNo() {
            noClicks++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const catImg = document.getElementById('catImg');
            const noText = document.getElementById('noText');

            if (catImages[noClicks]) {
                catImg.src = catImages[noClicks];
            }

            if (noClicks <= 7) {
                noText.innerText = noTexts[noClicks - 1];
            }

            if (noClicks < 7) {
                let newFontSize = 18 + (noClicks * 8); 
                let newPadding = 12 + (noClicks * 6);
                yesBtn.style.fontSize = `${newFontSize}px`;
                yesBtn.style.padding = `${newPadding}px ${newPadding * 2}px`;
                
                let noRightOffset = (Math.random() * 50) + (noClicks * 20);
                let noTopOffset = (Math.random() * 40 - 20);
                noBtn.style.transform = `translate(${noRightOffset}px, ${noTopOffset}px)`;
            } else {
                const appContainer = document.getElementById('app');
                appContainer.style.position = 'fixed';
                appContainer.style.top = '0';
                appContainer.style.left = '0';
                appContainer.style.width = '100vw';
                appContainer.style.height = '100vh';
                appContainer.style.maxWidth = 'none';
                appContainer.style.borderRadius = '0';
                appContainer.style.display = 'flex';
                appContainer.style.flexDirection = 'column';
                appContainer.style.justifyContent = 'center';
                appContainer.style.alignItems = 'center';
                
                yesBtn.style.fontSize = '80px';
                yesBtn.style.padding = '40px 80px';
                yesBtn.style.margin = '50px 0';
                noBtn.style.display = 'none';
                noText.style.fontSize = '25px';
            }
        }

        function handleYes() {
            const app = document.getElementById('app');
            const descParam = urlParams.get('desc');
            let decodedDesc = descParam ? decodeURIComponent(descParam) : '';
            
            let message = noClicks < 4 
                ? "Mình biết bạn đồng ý mà, đồng ý nhanh vậy ta! 🎉❤️" 
                : "Mình biết bạn đồng ý mà, đồng ý lâu quá à đổi từ nhanh thành lâu vậy... 😤❤️";
                
            app.innerHTML = `
                <img class="cat-img" src="${catImages.happy}" onerror="this.src='${fallbackImg}'" referrerpolicy="no-referrer" alt="Mèo nhảy múa">
                <h2>${message}</h2>
                ${decodedDesc ? `<div class="custom-desc">${decodedDesc}</div>` : ''}
            `;
        }
    </script>
</body>
</html>
